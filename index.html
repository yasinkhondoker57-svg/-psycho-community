<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Group Message</title>
  
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

  <style>
    /* টেক্সট সিলেকশন ও লং প্রেস লক করার জন্য CSS */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      -webkit-user-select: none; /* Safari */
      -moz-user-select: none;    /* Firefox */
      -ms-user-select: none;     /* IE10+/Edge */
      user-select: none;         /* Standard */
      -webkit-touch-callout: none; /* iOS/Android Long Press Disabled */
    }

    body {
      background-color: #fff0f3;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .app-container {
      width: 100%;
      max-width: 480px;
      background: #ffffff;
      height: 100vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
    }

    header {
      background: #ff4b6e;
      color: white;
      padding: 18px;
      text-align: center;
      font-size: 20px;
      font-weight: bold;
    }

    /* Auth Screen */
    #auth-screen {
      padding: 30px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1;
      text-align: center;
    }

    #auth-screen h2 {
      color: #ff4b6e;
      margin-bottom: 8px;
      font-size: 26px;
    }

    #auth-screen p {
      color: #666;
      font-size: 14px;
      margin-bottom: 30px;
    }

    .btn-google {
      width: 100%;
      padding: 14px;
      background: #ffffff;
      border: 2px solid #e0e0e0;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      font-size: 16px;
      font-weight: 600;
      color: #444;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }

    /* Chat Screen */
    #chat-screen {
      display: none;
      flex-direction: column;
      flex: 1;
    }

    .user-bar {
      background: #ffe5ec;
      padding: 10px 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
      color: #333;
      border-bottom: 1px solid #ffd1dc;
    }

    .logout-btn {
      background: #ff4b6e;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
    }

    .message-area {
      flex: 1;
      padding: 15px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .chat-input-container {
      display: flex;
      padding: 12px;
      background: #f9f9f9;
      border-top: 1px solid #eee;
      gap: 8px;
    }

    .chat-input-container input {
      flex: 1;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      outline: none;
      /* ইনপুট বক্সে যাতে ইউজার লিখতে পারে সেটার সিলেকশন অন রাখা হলো */
      -webkit-user-select: text;
      user-select: text;
    }

    .chat-input-container button {
      background: #ff4b6e;
      color: white;
      border: none;
      padding: 0 18px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body oncontextmenu="return false;"> <!-- রাইট ক্লিক বা লং প্রেস মেনু বন্ধ -->

  <div class="app-container">
    <header>Group Message</header>

    <!-- ১. লগইন স্ক্রিন -->
    <div id="auth-screen">
      <h2>Welcome Back</h2>
      <p>Group Message অ্যাপে যুক্ত হতে গুগলে ক্লিক করুন</p>
      
      <button class="btn-google" onclick="loginWithGoogle()">
        <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="20" height="20" alt="Google">
        Sign in with Google
      </button>
    </div>

    <!-- ২. মূল অ্যাপ স্ক্রিন -->
    <div id="chat-screen">
      <div class="user-bar">
        <span id="user-display-name">User</span>
        <button class="logout-btn" onclick="logout()">Logout</button>
      </div>

      <div class="message-area" id="message-container">
        <p style="text-align: center; color: #888; margin-top: 20px;">Welcome to Group Message! 🚀</p>
      </div>

      <div class="chat-input-container">
        <input type="text" id="msg-input" placeholder="Type a message...">
        <button onclick="sendMessage()">Send</button>
      </div>
    </div>
  </div>

  <script>
    // ⚙️ আপনার সঠিক Firebase Config
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "group-message-83a18.firebaseapp.com",
      projectId: "group-message-83a18",
      storageBucket: "group-message-83a18.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();

    auth.onAuthStateChanged((user) => {
      if (user) {
        document.getElementById('auth-screen').classList.add('hidden');
        document.getElementById('chat-screen').style.display = 'flex';
        document.getElementById('user-display-name').innerText = user.displayName || user.email;
      } else {
        document.getElementById('auth-screen').classList.remove('hidden');
        document.getElementById('chat-screen').style.display = 'none';
      }
    });

    // Google Sign In (Error Alert সহ)
    function loginWithGoogle() {
      const provider = new firebase.auth.GoogleAuthProvider();
      auth.signInWithPopup(provider).catch((error) => {
        // যদি পপআপ ব্লকে আটকে যায়, রিডাইরেক্ট ট্রাই করবে
        if (error.code === 'auth/popup-blocked' || error.code === 'auth/popup-closed-by-user') {
          auth.signInWithRedirect(provider);
        } else {
          alert("এরর মেসেজ: " + error.message);
        }
      });
    }

    function logout() {
      auth.signOut();
    }

    function sendMessage() {
      const input = document.getElementById('msg-input');
      const msg = input.value.trim();
      if(msg !== "") {
        const msgContainer = document.getElementById('message-container');
        const p = document.createElement('p');
        p.style.background = "#ffe5ec";
        p.style.padding = "8px 12px";
        p.style.borderRadius = "8px";
        p.style.alignSelf = "flex-end";
        p.innerText = msg;
        msgContainer.appendChild(p);
        input.value = "";
      }
    }
  </script>
</body>
</html>
